# Person. Home Assistant: homeassistant/components/person.
# Home Assistant's own facts for it (flags, actions) come from its source: catalogue/_ha.json (tools/read_ha_source.py).
# docs/CATALOGUE.md says what every key means.
domain: person
memory: {bytes: 128, extras: false}
firmware: 0.2.14   # the first firmware that draws this type
displays:
  standard: {}
  watch: {}
  # A map of where this person and the people with them are, drawn by the app as the card's picture (docs/MAP.md).
  map:
    screen: {pictures: true, firmware: 0.20.0}
# How a map frames its people (everyone on it, around home, around this person), how far a fixed view reaches, whether
# the tile's name is on it, and who may ride along beside the tile's own person: other people, and device trackers that
# report a place (a phone, a car, a tag), eight in all.
# The map tile of the screen's own cards (screen.map, firmware 0.21.0) has the same choices, and `follow`: everyone
# Home Assistant knows the place of, as its own map card's show_all, or the people and trackers chosen.
# `place` centres it on a point of its own, `centre` [latitude, longitude] on the tile. The map tile also has `show`:
# people and aircraft, only its people, or only its aircraft.
# How the map looks (app 0.4.36): a person's photo in their marker as Home Assistant shows it or their initials, the
# first names beside the markers, the zones, the streets or a plain ground, and the screen's look or one of its own.
# In place of the streets a map can show a chart (map_charts.py): the FAA's VFR sectional, IFR low or IFR high
# enroute chart, or the USGS topographic map, United States only, with the streets wherever the chart has nothing.
# `radar` draws a radar scope instead (map_card.draw_scope): range rings, bearings and the coast, water and highways in
# faint phosphor on black, in the phosphor of `scope`, whatever the look; the aircraft over it take the scope's style.
map:
  framing: [everyone, home, person, place]
  distance: [neighbourhood, street, town, region, radius]
  # The distance `radius`: a circle of this many metres round the middle, [default, lowest, highest].
  radius: [10000, 200, 500000]
  overlay: [name, none]
  follow: [everyone, chosen]
  show: [both, people, aircraft]
  markers: [photo, initials]
  names: [auto, always, never]
  zones: [show, hide]
  streets: [show, hide, sectional, ifr_low, ifr_high, topo, radar]
  scope: [green, amber, blue, white]
  look: [auto, light, dark]
  with: [person, device_tracker]
  max: 8
  # Aircraft over the map tile (screen.map, docs/MAP.md "Aircraft"): a sensor whose `flights` attribute lists them, as
  # the Flightradar24 integration's Current in area does, drawn by the screen over the map and moved in place on every
  # report. Their marker (a dot, a dot with its heading, or a plane turned to it), their label, their colour (by
  # altitude band or the screen's accent), the ones on the ground, whether they glide along their heading between two
  # reports, and their track. The numbers: [default, lowest, highest] of the track's seconds, the most planes on the
  # card and the altitudes in feet a plane is shown between. On a radar scope (`streets: radar`) a full view's beam can
  # turn and light up the planes it passes (`plane_sweep`).
  aircraft:
    plane_marker: [dot, arrow, plane]
    plane_label: [auto, none, callsign, altitude, full]
    plane_colour: [altitude, accent]
    plane_ground: [hide, show]
    plane_motion: [glide, hold]
    plane_track: [hide, show]
    plane_sweep: [hide, show]
    plane_track_s: [60, 10, 900]
    plane_most: [15, 1, 20]
    plane_min: [0, 0, 60000]
    plane_max: [60000, 0, 60000]
  # Watched aircraft on the map tile (`plane_watch`): up to `max` registrations or callsigns, each with one of these
  # colours (Home Assistant's own, theme.h ha::). A watched plane is always shown and labelled, larger and ringed.
  watch:
    colours: [red, orange, amber, green, blue, purple]
    max: 8
